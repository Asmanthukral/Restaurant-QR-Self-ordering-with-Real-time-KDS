        .categories-container { display: flex; gap: 12px; padding: 15px; overflow-x: auto; background: #0d0d0d; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #1a1a1a; }

        let cart = [];
        let currentFilter = 'all';

        function addToCart(id) {
            let item = menuData.find(i => i.id === id);
            let existing = cart.find(i => i.id === id);
            if(existing) { existing.qty++; } 
            else { cart.push({...item, qty: 1}); }
            updateUI();
        }

        function changeQty(id, delta) {
            let item = cart.find(i => i.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
                updateUI();
            }
        }

        function updateUI() {
            let total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            document.getElementById('cart-total').innerText = `₹${total}`;
            renderMenu(currentFilter === 'all' ? menuData : menuData.filter(i => i.category === currentFilter));
            updateCartList();
        }

        function updateCartList() {
            let list = document.getElementById('cart-items-list');
            list.innerHTML = cart.length === 0 ? "<p>Cart is empty</p>" : cart.map(i => `
                <div class="cart-item">
                    <span>${i.name}</span>
                    <div class="qty-btns">
                        <button onclick="changeQty(${i.id}, -1)">-</button>
                        <span>${i.qty}</span>
                        <button onclick="changeQty(${i.id}, 1)">+</button>
                    </div>
                </div>`).join('');
        }

        function toggleCart() {
            const m = document.getElementById('cart-modal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        function sendOrderToWhatsApp() {
            if(cart.length === 0) { alert("Cart is empty!"); return; }

    // 1. Get the table number from the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    
    // If no table is found in the URL, it defaults to 'Takeaway' (or you can set it to 'Unknown')
    const tableNum = urlParams.get('table') || 'Takeaway'; 

    // 2. Insert the dynamic table number using template literals (backticks ` `)
    // Make sure to keep your existing cart.map logic exactly as you have it
    let msg = `Order Table ${tableNum}:%0A` + cart.map((i,n) => `${n+1}. ${i.name} (x${i.qty})`).join('%0A'); // Replace with your exact map logic if different
    
    // 3. Open WhatsApp
    window.open(`https://wa.me/917415446230?text=${msg}`, '_blank');
}

        function renderMenu(items) {
  let container = document.getElementById('menu-container'); // Make sure this matches your container ID
  
  container.innerHTML = items.map(item => {
    // 1. Check if this specific item is already in the cart
    let cartItem = cart.find(c => c.id === item.id);
    let qty = cartItem ? cartItem.qty : 0;

    // 2. Generate the HTML
    return `
      <div class="menu-card"> <!-- Adjust this class to match your existing HTML -->
        <div class="item-info">
          <h3>${item.name}</h3>
          <p class="price">₹${item.price}</p>
        </div>
        
        <div class="action-btn-container">
          <!-- 3. If qty is 0 show ADD, otherwise show the + / - counter -->
          ${qty === 0 
            ? `<button class="add-btn" onclick="addToCart(${item.id})">ADD</button>`
            : `<div class="menu-qty-control">
                 <!-- Notice how we use your exact changeQty function here! -->
                 <button onclick="changeQty(${item.id}, -1)">-</button>
                 <span>${qty}</span>
                 <button onclick="changeQty(${item.id}, 1)">+</button>
               </div>`
          }
        </div>
      </div>
    `;
  }).join('');
}

            el.classList.add('active');
            renderMenu(cat === 'all' ? menuData : menuData.filter(i => i.category === cat));
